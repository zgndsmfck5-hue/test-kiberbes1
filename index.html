<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тест: Кибербезопасность</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0b0c10;
      color: #fff;
      overflow-x: hidden; 
      width: 100%;
      min-height: 100dvh;
    }

    /* ================= ЭКРАНЫ ================= */
    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px; 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #0b0c10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
      overflow-y: auto; 
    }
    
    .screen.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10, 11, 20, 0.75), rgba(30, 20, 60, 0.85));
      z-index: 0;
      min-height: 100%; 
    }

    #screen-start::before, #screen-results::before {
      background: rgba(0, 0, 0, 0.3); 
    }

    /* ================= КОНТЕЙНЕР КОНТЕНТА ================= */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 700px;
      margin: auto; 
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .screen.active .content {
      transform: translateY(0) scale(1);
    }

    #screen-start .content {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 80vh; 
      padding-bottom: 50px;
    }

    #screen-results .content {
      background: rgba(5, 10, 20, 0.8);
      border: 2px solid rgba(34, 197, 94, 0.4);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
      text-align: center;
      max-width: 450px;
    }

    /* ================= ТЕКСТ ================= */
    h2 { font-size: clamp(1.1rem, 3.5vw, 1.5rem); margin-bottom: 20px; line-height: 1.4; text-align: center; }
    p { color: #cbd5e1; font-size: clamp(1rem, 3.5vw, 1.2rem); text-align: center; margin-bottom: 15px; }

    /* ================= КНОПКИ ================= */
    .btn {
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: clamp(1.1rem, 4vw, 1.3rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
      animation: pulse-btn 2s infinite;
      margin-top: 10px;
      width: 100%;
      max-width: 300px; 
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 242, 254, 0.9); }

    #screen-results .btn {
      background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
      color: #fff;
      animation: pulse-btn-green 2s infinite;
    }

    @keyframes pulse-btn {
      0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
      50% { box-shadow: 0 0 30px rgba(0, 242, 254, 1); }
      100% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
    }
    @keyframes pulse-btn-green {
      0% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
      50% { box-shadow: 0 0 30px rgba(34, 197, 94, 1); }
      100% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }
    }

    /* ================= ОТВЕТЫ ================= */
    .answers { display: flex; flex-direction: column; gap: 10px; }
    
    .answer {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      font-size: clamp(0.9rem, 3vw, 1rem);
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      line-height: 1.3;
    }
    
    .answer .letter {
      background: rgba(255, 255, 255, 0.2);
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: bold; flex-shrink: 0;
      font-size: 0.9rem;
    }
    
    .answer:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }
    
    @media (min-width: 600px) {
      .answer:hover:not(.disabled) { transform: translateX(5px); }
    }

    .answer.selected {
      background: rgba(0, 242, 254, 0.2) !important;
      border-color: #00f2fe !important;
    }

    .answer.disabled { cursor: default; }

    .answer.correct {
      background: rgba(34, 197, 94, 0.25) !important;
      border-color: #22c55e !important;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
    }
    .answer.correct .letter { background: #22c55e; }

    .answer.wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: #ef4444 !important;
    }
    .answer.wrong .letter { background: #ef4444; }

    /* Кнопка "Дальше" для мультивыбора */
    .next-btn {
      display: none;
      margin-top: 20px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      border: none;
      text-transform: uppercase;
    }
    .next-btn.show { display: block; }

    /* ================= ПРОГРЕСС И РЕЗУЛЬТАТЫ ================= */
    .progress-bar {
      height: 6px; background: rgba(255, 255, 255, 0.1);
      border-radius: 10px; margin-bottom: 20px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe);
      width: 6.6%; transition: width 0.4s ease;
    }
    
    .score { 
      font-size: clamp(3rem, 10vw, 4rem); 
      font-weight: 800; color: #22c55e; 
      text-align: center; margin: 10px 0; 
      text-shadow: 0 0 20px rgba(34,197,94,0.6); line-height: 1;
    }

    @media (max-width: 500px) {
      .content { padding: 20px 15px; border-radius: 16px; }
      #screen-start .content { padding-bottom: 30px; }
      #screen-results .content { padding: 25px 15px; }
      .answer { padding: 12px; gap: 10px; }
      .answer .letter { width: 26px; height: 26px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <section class="screen active" id="screen-start">
    <div class="content">
      <button class="btn" onclick="startQuiz()">Начать тест</button>
    </div>
  </section>

  <section class="screen" id="screen-quiz">
    <div class="content">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <h2 id="q-text">Текст вопроса</h2>
      <div class="answers" id="answers-box"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">Дальше</button>
    </div>
  </section>

  <section class="screen" id="screen-results">
    <div class="content">
      <p id="res-verdict">Твой результат:</p>
      <div class="score" id="res-score">0 / 15</div>
      <button class="btn" onclick="startQuiz()">Пройти ещё раз</button>
    </div>
  </section>

  <script>
    /* =========================================================
       ЗДЕСЬ МЫ ДОБАВИЛИ ПУТИ ДЛЯ НОВЫХ 10 КАРТИНОК
       ========================================================= */
    const IMAGES = {
      start: 'images/bg-start.jpg',
      results: 'images/bg-results.jpg',
      q1: 'images/q1.jpg',
      q2: 'images/q2.jpg',
      q3: 'images/q3.jpg',
      q4: 'images/q4.jpg',
      q5: 'images/q5.jpg',
      // Новые фоны для вопросов 6-15
      q6: 'images/q6.jpg',
      q7: 'images/q7.jpg',
      q8: 'images/q8.jpg',
      q9: 'images/q9.jpg',
      q10: 'images/q10.jpg',
      q11: 'images/q11.jpg',
      q12: 'images/q12.jpg',
      q13: 'images/q13.jpg',
      q14: 'images/q14.jpg',
      q15: 'images/q15.jpg'
    };

    const QUESTIONS = [
      // --- 1-5 ВОПРОСЫ ---
      {
        text: '1. Что такое кибербуллинг?',
        bg: IMAGES.q1,
        answers: [
          'Случайный спор о том, какая видеоигра лучше',
          'Жестокая и повторяющаяся травля, оскорбления или угрозы в интернете',
          'Когда друг не прочитал твое сообщение в мессенджере',
          'Вежливая подсказка о том, как решить задачу по математике'
        ],
        correct: 1 
      },
      {
        text: '2. Тебе в личные сообщения начали приходить неприятные угрозы и оскорбления. Как поступить правильнее всего?',
        bg: IMAGES.q2,
        answers: [
          'Начать отвечать грубостью и угрозами в ответ',
          'Удалить переписку и никому об этом не рассказывать',
          'Написать гневный пост обо всех в школьном паблике',
          'Сделать скриншоты переписки, заблокировать обидчика и рассказать взрослому'
        ],
        correct: 3 
      },
      {
        text: '3. Тебе на телефон звонит незнакомый дядя серьезным голосом и говорит: «Я из милиции! Твои родители попали в беду, срочно переведи мне деньги с маминой карты!». Что делать?',
        bg: IMAGES.q3,
        answers: [
          'Взять мамину карту и перевести деньги, чтобы помочь родителям',
          'Сбросить звонок и сразу рассказать о нем родителям или бабушке',
          'Испугаться и пересказать ему все домашние секреты',
          'Попросить у него фамилию и адрес, чтобы самому приехать в милицию'
        ],
        correct: 1 
      },
      {
        text: '4. Что такое «цифровой след» в интернете?',
        bg: IMAGES.q4,
        answers: [
          'Вся информация о тебе (посты, фото, комментарии и лайки), которая остаётся в сети',
          'Специальный вирус, который следит за геопозицией телефона',
          'Общее число подписчиков в твоем профиле',
          'История просмотров в режиме «инкогнито»'
        ],
        correct: 0 
      },
      {
        text: '5. Что происходит, если человек нарушает закон или чужие права?',
        bg: IMAGES.q5,
        answers: [
          'Ничего не происходит, до 18 лет законы не работают',
          'Ему всегда просто дарят новую конфету',
          'Наступает ответственность: от замечания до наказания по закону',
          'Учитель навсегда забирает школьный дневник'
        ],
        correct: 2 
      },

      // --- 6-10 ВОПРОСЫ ---
      {
        text: '6. Тебе приходит сообщение якобы от администрации школы: «Твой аккаунт будет заблокирован! Срочно перейди по ссылке и введи пароль». Что делать?',
        bg: IMAGES.q6,
        answers: [
          'Сразу перейти по ссылке и ввести пароль',
          'Ответить отправителю и попросить пароль',
          'Не переходить по ссылке и проверить информацию через официальный сайт или учителя',
          'Переслать сообщение всем друзьям'
        ],
        correct: 2
      },
      {
        text: '7. Какие признаки могут указывать на интернет-мошенничество? (Выбери ВСЕ подходящие варианты)',
        bg: IMAGES.q7,
        answers: [
          'Требуют срочно перевести деньги или сообщить код из SMS',
          'Присылают подозрительную ссылку на неизвестный сайт',
          'Предлагают ознакомиться с правилами конкурса на официальном сайте без требования личных данных',
          'Обещают дорогой подарок за небольшую предоплату'
        ],
        correct: [0, 1, 3] 
      },
      {
        text: '8. Никому нельзя сообщать одноразовые коды подтверждения из SMS или приложения, даже если человек представляется сотрудником службы поддержки.',
        bg: IMAGES.q8,
        answers: [
          'Верно',
          'Неверно'
        ],
        correct: 0 
      },
      {
        text: '9. Тебе звонит знакомый голосом друга и срочно просит перевести деньги. Позже выясняется, что голос мог быть создан нейросетью. Как лучше поступить?',
        bg: IMAGES.q9,
        answers: [
          'Сразу перевести деньги, ведь голос знакомый',
          'Проверить информацию, связавшись с другом по известному номеру или другим способом',
          'Отправить свои личные данные для подтверждения личности',
          'Попросить позвонить ещё раз и сразу согласиться'
        ],
        correct: 1 
      },
      {
        text: '10. Если подключиться к общественной сети Wi-Fi в кафе или торговом центре, все передаваемые данные автоматически становятся защищёнными.',
        bg: IMAGES.q10,
        answers: [
          'Верно',
          'Неверно'
        ],
        correct: 1 
      },

      // --- 11-15 ВОПРОСЫ ---
      {
        text: '11. Если приложение скачано из официального магазина, оно гарантированно не собирает лишние личные данные.',
        bg: IMAGES.q11,
        answers: [
          'Верно',
          'Неверно'
        ],
        correct: 1 
      },
      {
        text: '12. Ты скачиваешь приложение-фонарик, а оно просит доступ к контактам, микрофону и геолокации. Что лучше сделать?',
        bg: IMAGES.q12,
        answers: [
          'Отключить пароль на телефоне',
          'Проверить разрешения и не предоставлять доступы, которые не нужны для работы приложения',
          'Разрешить всё, чтобы приложение работало быстрее',
          'Отправить разработчику свои контакты'
        ],
        correct: 1 
      },
      {
        text: '13. Даже если профиль в социальной сети закрытый, опубликованное фото или видео может попасть к посторонним людям.',
        bg: IMAGES.q13,
        answers: [
          'Верно',
          'Неверно'
        ],
        correct: 0 
      },
      {
        text: '14. Как можно лучше защитить свой аккаунт в социальной сети? (Выбери ВСЕ правильные действия)',
        bg: IMAGES.q14,
        answers: [
          'Не сообщать пароль другим людям',
          'Использовать сложный и уникальный пароль',
          'Включить двухфакторную аутентификацию',
          'Использовать один пароль на всех сайтах'
        ],
        correct: [0, 1, 2] 
      },
      {
        text: '15. Ты познакомился с человеком в интернете. Он просит прислать фотографию паспорта или назвать домашний адрес. Как поступить?',
        bg: IMAGES.q15,
        answers: [
          'Отправить, если он кажется дружелюбным',
          'Не отправлять личные данные и прекратить подозрительный разговор',
          'Попросить его сначала отправить свой документ',
          'Отправить только часть документов'
        ],
        correct: 1 
      }
    ];

    const screens = {
      start: document.getElementById('screen-start'),
      quiz: document.getElementById('screen-quiz'),
      results: document.getElementById('screen-results')
    };
    
    const qText = document.getElementById('q-text');
    const answersBox = document.getElementById('answers-box');
    const progressFill = document.getElementById('progress');
    const nextBtn = document.getElementById('next-btn');
    
    let currentIndex = 0;
    let score = 0;
    let selectedMulti = []; 
    let isMulti = false;

    screens.start.style.backgroundImage = `url('${IMAGES.start}')`;
    screens.results.style.backgroundImage = `url('${IMAGES.results}')`;

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function startQuiz() {
      currentIndex = 0;
      score = 0;
      showScreen('quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = QUESTIONS[currentIndex];
      screens.quiz.style.backgroundImage = `url('${q.bg}')`;
      progressFill.style.width = `${((currentIndex + 1) / QUESTIONS.length) * 100}%`;
      qText.textContent = q.text;
      answersBox.innerHTML = '';
      nextBtn.classList.remove('show'); 
      selectedMulti = [];
      isMulti = Array.isArray(q.correct);

      q.answers.forEach((answer, index) => {
        const btn = document.createElement('button');
        btn.className = 'answer';
        
        let letterHtml = '';
        if (q.answers.length > 2) {
          const letters = ['A', 'B', 'C', 'D'];
          letterHtml = `<span class="letter">${letters[index]}</span> `;
        }
        
        btn.innerHTML = `${letterHtml}<span>${answer}</span>`;
        btn.onclick = () => handleAnswer(index, btn);
        answersBox.appendChild(btn);
      });
    }

    function handleAnswer(selectedIndex, clickedBtn) {
      const q = QUESTIONS[currentIndex];
      
      if (isMulti) {
        if (clickedBtn.classList.contains('disabled')) return;
        if (clickedBtn.classList.contains('correct') || clickedBtn.classList.contains('wrong')) return;

        if (clickedBtn.classList.contains('selected')) {
          clickedBtn.classList.remove('selected');
          selectedMulti = selectedMulti.filter(i => i !== selectedIndex);
        } else {
          clickedBtn.classList.add('selected');
          selectedMulti.push(selectedIndex);
        }

        if (selectedMulti.length > 0) {
          nextBtn.classList.add('show');
        } else {
          nextBtn.classList.remove('show');
        }
        return;
      }

      const allBtns = document.querySelectorAll('.answer');
      allBtns.forEach(b => b.classList.add('disabled'));
      allBtns[q.correct].classList.add('correct');
      
      if (selectedIndex !== q.correct) {
        clickedBtn.classList.add('wrong');
      } else {
        score++;
      }

      setTimeout(() => {
        nextQuestion();
      }, 1800); 
    }

    function nextQuestion() {
      const q = QUESTIONS[currentIndex];

      if (isMulti) {
        const allBtns = document.querySelectorAll('.answer');
        allBtns.forEach(b => b.classList.add('disabled'));
        
        let isPerfect = selectedMulti.length === q.correct.length && selectedMulti.every(val => q.correct.includes(val));
        
        allBtns.forEach((btn, idx) => {
          if (q.correct.includes(idx)) {
            btn.classList.add('correct');
          } else if (selectedMulti.includes(idx)) {
            btn.classList.add('wrong');
          }
          btn.classList.remove('selected');
        });

        if (isPerfect) score++;

        nextBtn.style.display = 'none';
        setTimeout(() => {
          currentIndex++;
          if (currentIndex < QUESTIONS.length) renderQuestion();
          else showResults();
        }, 2000);
        return;
      }

      currentIndex++;
      if (currentIndex < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      showScreen('results');
      const total = QUESTIONS.length;
      const percent = (score / total) * 100;
      
      let verdict = '';
      if (percent === 100) verdict = 'Идеально! Ты настоящий эксперт по кибербезопасности.';
      else if (percent >= 80) verdict = 'Отличный результат! Ты знаешь, как защитить себя.';
      else if (percent >= 50) verdict = 'Неплохо, но некоторые правила стоит повторить.';
      else verdict = 'Будь осторожнее! Стоит изучить базовые правила безопасности.';

      document.getElementById('res-score').textContent = `${score} / ${total}`;
      document.getElementById('res-verdict').textContent = verdict;
    }
  </script>
</body>
</html>
